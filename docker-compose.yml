services:
  db:
    image: postgres:17-alpine
    container_name: sumamatriculas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - sumamatriculas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: suma-matriculas-app:latest
    container_name: sumamatriculas_app
    restart: unless-stopped
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    ports:
      - "4000:4000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      SESSION_SECRET: sumamatriculas_dev_secret_cambiar_en_produccion
      APP_URL: http://localhost:4000
      NG_ALLOWED_HOSTS: localhost,127.0.0.1
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PORT: 4000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  sumamatriculas_pgdata:
    driver: local