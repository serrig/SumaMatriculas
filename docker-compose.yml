services:
  db:
    image: postgres:17-alpine
    container_name: sumamatriculas_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Bind to loopback only — never expose Postgres to the LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      - sumamatriculas_pgdata:/var/lib/postgresql/data
      # Init scripts run once on first cluster init (alphabetical order).
      # The script creates a non-superuser APP_DB_USER for the application.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: suma-matriculas-app:latest
    container_name: sumamatriculas_app
    restart: unless-stopped
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  sumamatriculas_pgdata:
    driver: local